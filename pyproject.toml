[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-intent"
version = "0.1.0"
description = "Real-time movement-intention estimation from EEG, EMG and motion-capture signals"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rikuki NOBUHARA" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "mne",
    "mne-icalabel",
    "asrpy",
    "pyxdf",
    "torch",
    "matplotlib",
    "seaborn",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]
